<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify - Web Player: Music for everyone</title>
    <link
      rel="icon"
      type="image/png"
      href="https://open.spotify.com/favicon.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/all/all.min.css"
    />
  </head>
  <body>
    <div class="h-hdv flex flex-col">
      <header class="h-16 bg-blue-500 flex items-center px-4">
        <!--left-->
        <div class="flex-1">
          <a href="#" class="inline-flex items-center">LOGO</a>
        </div>

        <!--center-->
        <div class="flex items-center justify-center gap-2">
          <!--nút home-->
          <button
            class="w-12 h-12 rounded-full bg-[#1f1f1f] text-[#b3b3b3] hover:text-white hover:bg-[#2a2a2a] hover:scale-104 active:scale-96 transition-all flex items-center justify-center"
          >
            <i class="fi fi-rr-house-blank text-xl"></i>
          </button>

          <!--search bar-->
          <div class="flex items-center">
            <form
              class="group w-118.5 h-12 rounded-full bg-[#1f1f1f] hover:bg-[#2828282] focus-within:bg-[#28282] focus-within:ring-2 focus-within:ring-white flex items-center px-2 transition-colors"
            >
              <!--kính lúp-->
              <button
                type="button"
                class="text-[#b3b3b3] flex items-center justify-center p-2 text-[$b3b3b3] group-hover:text-white group-focus-within:text-white transition-colors"
              >
                <i class="fi fi-rr-search text-[20px] leading-none"></i>
              </button>

              <!--tìm kiếm-->
              <input
                type="text"
                placeholder="What do you want to play?"
                class="flex-1 text-m px-2 w-full bg-transparent outline-none text-white"
              />

              <!--gạch dọc-->
              <div class="h-6 w-px bg-[#7c7c7c] mx-2"></div>

              <!--nút browse-->
              <button
                type="button"
                class="flex items-center justify-center p-2 text-white"
                title="Browse"
              >
                <i class="fi fi-sr-inbox text-lg"></i>
              </button>
            </form>
          </div>
        </div>

        <!--right Action-->
        <div class="flex-1 flex items-center justify-end gap-4">
          <button>Premium</button>
          <div>
            <i class="fi fi-ss-download"></i>
            <button>install</button>
          </div>
          <button>noti</button>
          <button>friend</button>
          <button class="px-5 py-2 bg-white rounded-full">profile</button>
          <a href="#">Sign Up</a>
          <a href="#">Login</a>
        </div>
      </header>
      <div class="flex gap-2 flex-1">
        <aside class="w-80 bg-gray-500">aside</aside>
        <main class="bg-gray-900 flex-1">main</main>
      </div>
      <div id="controls" class="h-22 bg-amber-300">Controls</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
